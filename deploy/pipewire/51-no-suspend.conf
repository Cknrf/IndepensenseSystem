# Stop PipeWire suspending the wearable's audio output.
#
# Why this file exists
# --------------------
#
# WirePlumber suspends an ALSA node after a few seconds idle and resumes
# it when something next plays. On this device the resume swallows
# roughly the first 0.7-0.9 seconds of audio, which is longer than most
# of the sounds the wearable makes.
#
# Measured, not guessed. Each of these was played at a 3-second gap, so
# the device had suspended in between:
#
#     stop cue                 0.20 s   inaudible
#     stop cue + padding       0.64 s   inaudible
#     plain tone               1.00 s   audible
#
# And the same short cue played 0.3 s after a long tone — device still
# awake — was audible. Duration is the only variable that mattered.
#
# `audio_probe` ruled out everything inside the application: the stream
# negotiated the requested 22050 Hz, reported 23 ms of latency, and
# consumed 1.0 s of audio in 0.96 s on every attempt, first or last. The
# audio was always produced correctly; it was discarded downstream.
#
# What it was breaking
# --------------------
#
# Every non-speech cue, which is the entire acknowledgement vocabulary
# added for a user who cannot see the device:
#
#   * the PTT press chime - the first sound after idle, so always eaten
#   * the stop cue, played after speech ends
#   * the busy cue, played after a quiet refused press
#   * the waiting blip, played after 1.5 s of deliberate silence
#
# Speech mostly survived and hid the problem: an utterance runs 2-5
# seconds, so it lost its opening and the listener's context filled the
# gap. In an ordinary interaction - chime, record, chime, answer - only
# the first sound falls in the window, which is why this went unnoticed
# until the cues were tested on their own.
#
# Why not fix it in software
# --------------------------
#
# It was tried. `voice/audio.py` briefly opened every stream with 0.2 s
# of silence to absorb what was assumed to be a start-up underrun. It
# made things worse: the padding pushed the sound further into the
# window being discarded, turning a clipped cue into a silent one. The
# only software fix that would work is ~1 s of latency on every sound the
# device makes, which is a worse product than the bug.
#
# The cost
# --------
#
# The USB DAC stays powered and PipeWire keeps a node running: tens of
# milliwatts, against a Pi 5 that draws 3-5 W running YOLO, Whisper and
# Ollama. Under one percent of the power budget, and it affects only the
# audio node - not CPU, WiFi or USB autosuspend generally.
#
# Install
# -------
#
#     mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#     cp 51-no-suspend.conf ~/.config/wireplumber/wireplumber.conf.d/
#     systemctl --user restart wireplumber
#
# Per-user, not system-wide, because PipeWire and WirePlumber run in the
# user session - the same reason `indepensense.service` has to be told
# where `XDG_RUNTIME_DIR` is.
#
# Verify with the cue test. Every cue must be audible at every gap:
#
#     python -m indepensense.voice.tests.manual.cue_test
#
# Or directly, which is how the fault was found:
#
#     python -c "
#     from indepensense.voice.audio import play_stop_cue
#     import time
#     for n in range(5):
#         play_stop_cue(); time.sleep(3)
#     "
#
# Five cues, five sounds. Before this file, one.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        # Do not suspend the node when nothing is playing.
        session.suspend-timeout-seconds = 0

        # And do not let it go idle either. This is the one that matters
        # for a USB headset: a suspended node is torn down, but an *idle*
        # node merely stops feeding the ALSA device — and the headset's
        # own amplifier mutes when the wire goes quiet. Keeping the node
        # running means silence is still being written, so the amp stays
        # awake and the next sound starts instantly.
        node.pause-on-idle = false
      }
    }
  }
]
