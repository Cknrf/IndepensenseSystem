# Drop-in for the Ollama installer's own unit. Installed to
# /etc/systemd/system/ollama.service.d/override.conf — see README.md.
#
# Ollama reads the 1.9 GB NLU model from the SD card at boot, at the same
# time the wearable is loading Whisper and the TTS voices from it. It
# cannot be ordered after the wearable the way GraphHopper and Photon are:
# the app's own LLM warmup needs it, and the warmup unit pins the model
# early so the first voice command does not pay the load. So it keeps its
# place and drops its I/O priority instead — lowest best-effort, which
# under the bfq scheduler yields to the wearable's reads without ever
# being starved. CPU priority is left alone: at runtime this process is
# the voice command's slowest stage.
# The three Environment lines below were live on the device but had never
# been captured here, so installing this file as-is would have silently
# dropped them on a rebuild. Found 2026-10-10 while inventorying the SD
# card; see docs/sd-card-migration.md.
#
#   OLLAMA_LOAD_TIMEOUT=5m
#       The 1.4 GB model loads off the SD card. Ollama's default is well
#       under the time that takes on a slow card, and a timed-out load
#       surfaces as a failed voice command rather than as a load error.
#
#   OLLAMA_NUM_PARALLEL=1 / OLLAMA_MAX_LOADED_MODELS=1
#       One request and one model at a time. The Pi 5 has 8 GB shared
#       with Whisper, the TTS voices, YOLO and the embedding model;
#       letting Ollama hold a second model resident is what pushes the
#       box into swap. Voice commands are strictly one-at-a-time anyway
#       — the PTT button serialises them — so parallelism buys nothing
#       and costs memory headroom.
[Service]
Environment="OLLAMA_LOAD_TIMEOUT=5m"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
IOSchedulingClass=best-effort
IOSchedulingPriority=7
