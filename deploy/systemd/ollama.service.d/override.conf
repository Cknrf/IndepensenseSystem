# Drop-in for the Ollama installer's own unit. Installed to
# /etc/systemd/system/ollama.service.d/override.conf — see README.md.
#
# Ollama reads the 1.9 GB NLU model from the SD card at boot, at the same
# time the wearable is loading Whisper and the TTS voices from it. It
# cannot be ordered after the wearable the way GraphHopper and Photon are:
# the app's own LLM warmup needs it, and the warmup unit pins the model
# early so the first voice command does not pay the load. So it keeps its
# place and drops its I/O priority instead — lowest best-effort, which
# under the bfq scheduler yields to the wearable's reads without ever
# being starved. CPU priority is left alone: at runtime this process is
# the voice command's slowest stage.
[Service]
IOSchedulingClass=best-effort
IOSchedulingPriority=7
